name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Verify package
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify

    # workflow_dispatch permet seulement de tester la release.
    # La publication réelle exige un tag.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    environment:
      name: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check that tag and Cargo version match
        run: |
          cargo_version="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          )"
          tag_version="${GITHUB_REF_NAME#v}"

          echo "Cargo.toml version: ${cargo_version}"
          echo "Tag version: ${tag_version}"

          test "${cargo_version}" = "${tag_version}"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}