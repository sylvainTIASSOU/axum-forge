[package]
name = "cargo-axum-forge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Cargo subcommand for generating structured Axum applications"
repository = "https://github.com/sylvainTIASSOU/axum-forge"
readme = "README.md"
keywords = ["axum", "cargo", "cli", "generator", "scaffolding"]
categories = [
    "command-line-utilities",
    "development-tools::cargo-plugins",
]
include = [
    "src/**",
    "templates/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
]


[dependencies]
anyhow = "1.0.104"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
minijinja = "3.0.5"
regex = "1.13.1"


[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
